name: wt-app

# 应用层编排：只跑 api。三个数据服务归 data/（project wt-infra），这里不复制、不合并。
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wt-api
    # 数据层缺席时启动探活会失败并退出，容器停在 Exited 而不是反复重启：
    # 拉起一个永远 healthz 503 的容器只会掩盖"数据层没起"这个事实。
    restart: "no"
    env_file:
      - .env
    environment:
      # 容器内用 container_name 直连（同一网络）。这四个插值变量来自 .env：
      # 缺失时 docker compose 会静默替换成空串，表现为启动即 NOAUTH / password authentication failed。
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@wt-postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@wt-redis:6379/0
      S3_ENDPOINT: http://wt-minio:9000
      S3_BUCKET: ${S3_BUCKET}
      PI_TELEMETRY: "0"
    ports:
      - "8000:8000"
    networks:
      - wt-infra
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

networks:
  # external：接入 data/ 已经建好的网络，不做任何重建
  wt-infra:
    external: true
    name: wt-infra_default
