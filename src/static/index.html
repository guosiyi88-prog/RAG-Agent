<!doctype html>
<!-- 静态壳：无框架、无构建、无 npm 运行时依赖（ADR-0005）。
     所有可见文字都是**英文兜底文本** + data-i18n key；08#01（五语文案表）接管后，user.js 的
     applyLang() 会用 /api/i18n 的合并结果整页替换。本文件不保留第二份语言，兜底文本只为
     "JS 还没跑"/"接口挂了"这一小段时间可读。
     兜底语言必须与界面语言的回落终点一致（`lib/lang.js:FALLBACK_LANG = "en"`）：以前这里是德语，
     于是中文/荷兰语/西班牙语浏览器的人会先看到一闪德语。<html lang> 同理，applyLang 会改写它。
     隐藏视图（故障码 / 工单 / 我的）里的兜底仍是德语 —— 它们 `hidden`，JS 跑起来之前不可能被看到。
     本文件不含任何 JS 逻辑：脚本只有末尾那一个 module 引用。 -->
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="app-version" content="0.1.0">
<title>WOTAI Support</title>
<!-- 唯一的外部资源：Space Grotesk 500/700，display=swap + 双 preconnect（09 §9）。
     版式字只用于标题；正文走 --font-ui 的系统栈，断网/弱网首屏不为字体等待。 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&amp;display=swap">
<!-- 下面的内联样式块是 src/static/app.css 的逐字内联（09 §9：≤15KB，注释也算字节）。

<style>/* 令牌 09 §1：禁裸色值 */
:root{
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s6:24px;--s8:32px;--s12:48px;

  --u-primary:#F97316;              /* 只做填充 */
  --u-primary-ink:#C2410C;          /* 白底文字，5.2:1 */
  --u-on-primary:#0F172A;
  --u-accent:#22C55E;
  --u-bg:#FFFFFF;--u-surface:#F8FAFC;--u-text:#0F172A;
  --u-muted:#64748B;--u-border:#E2E8F0;
  --u-danger:#EF4444;--u-warn:#F59E0B;
  --c-primary:#0F172A;--c-on-primary:#FFFFFF;--c-cta:#0369A1;
  --c-bg:#F8FAFC;--c-surface:#FFFFFF;--c-border:#E2E8F0;
  --c-text:#0F172A;--c-muted:#64748B;
  --c-st-open:#F59E0B;--c-st-claimed:#0369A1;--c-st-closed:#22C55E;
  --c-st-sla:#EF4444;--c-st-other:#8B5CF6;
  --u-scrim:rgba(0,0,0,.5);
  --u-mark:rgba(249,115,22,.22);

*,*::before,*::after{box-sizing:border-box}

button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
a{color:inherit;text-decoration:none}

svg{display:block}

.icon{width:20px;height:20px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}

.phone{width:min(100%,calc(var(--frame-h) * 9 / 16));height:min(var(--frame-h),calc(100vw * 16 / 9));aspect-ratio:9/16;display:flex;flex-direction:column;background:var(--u-bg);overflow:hidden;position:relative;box-shadow:0 0 0 1px var(--u-border);padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

.hdr-title{flex:1 1 auto;min-width:0;font-family:var(--font-display);font-size:var(--t-title);font-weight:700;line-height:var(--lh-tight);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hdr-back,.hdr-lang{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;gap:var(--s1);min-width:44px;min-height:44px;padding:0 var(--s2);border:1px solid var(--u-border);border-radius:var(--r-md);background:transparent;color:var(--u-text);font-size:var(--t-sm);font-weight:600;line-height:1}
.lang-code{font-variant-numeric:tabular-nums}
.offline{flex:0 0 auto;display:flex;align-items:center;gap:var(--s2);padding:var(--s2) var(--s3);background:var(--u-warn);color:var(--u-on-primary);font-size:var(--t-sm);font-weight:600;line-height:var(--lh-tight);overflow-wrap:anywhere}
.stream,.fault,.ticket-view,.me-view{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:var(--s3);padding:var(--s4) var(--s3) var(--s3);user-select:text;-webkit-user-select:text}

.row{display:flex;align-items:flex-end;gap:var(--s2);max-width:100%}

.avatar-u{background:var(--u-primary);border-color:transparent;color:var(--u-on-primary)}
/* 双写：.bubble--* 与 .msg-* */
.bubble--error,.msg-err{background:var(--u-surface);color:var(--u-text);border:1px solid var(--u-danger);border-left-width:3px}
.bubble-actions,.msg-actions{display:flex;flex-wrap:wrap;gap:var(--s2);margin-top:var(--s3)}
.bubble-actions .btn,.msg-actions .btn{flex:1 1 auto}
.note,.msg-sys{align-self:center;padding:0;border:0;font-size:var(--t-cap);color:var(--u-muted);text-align:center;overflow-wrap:anywhere}
.ticket-card{margin-top:var(--s3);padding:var(--s3);border:1px solid var(--u-border);border-radius:var(--r-md);background:var(--u-bg)}
.ticket-no{font-family:var(--font-mono);font-size:var(--t-title);font-weight:700;letter-spacing:.02em;overflow-wrap:anywhere;user-select:all;-webkit-user-select:all}
.ticket-hint{margin-top:var(--s1);font-size:var(--t-sm);color:var(--u-muted)}
.cursor{display:inline-block;width:.45em;height:1em;margin-left:1px;vertical-align:-.15em;border-radius:1px;background:currentColor;animation:blink 1s steps(1,end) infinite}
body[data-state="refused"] .cursor,body[data-state="error"] .cursor{display:none}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.status{flex:0 0 auto;display:flex;align-items:center;gap:var(--s2);padding:var(--s2) var(--s3);border-top:1px solid var(--u-border);font-size:var(--t-sm);color:var(--u-muted);overflow-wrap:anywhere}

.composer{flex:0 0 auto;display:flex;align-items:flex-end;gap:var(--s2);min-height:var(--composer-h);padding:var(--s2) var(--s3);border-top:1px solid var(--u-border);background:var(--u-bg)}
.composer-input{flex:1 1 auto;min-width:0;max-width:100%;min-height:44px;max-height:120px;padding:var(--s3);border:1px solid var(--u-border);border-radius:var(--r-md);background:var(--u-surface);color:var(--u-text);font:inherit;line-height:var(--lh-body);resize:none;overflow-y:auto;overscroll-behavior:contain;user-select:text;-webkit-user-select:text}
.composer-input::placeholder{color:var(--u-muted)}
.composer .composer-send{flex:0 0 auto;width:auto;min-width:44px;height:44px;padding:0 var(--s1)}
.composer .composer-send[disabled]{opacity:.45;cursor:not-allowed;transform:none}
body[data-state="streaming"] .composer-send{border-color:var(--u-primary-ink)}
.composer .composer-send .send-label[hidden]{display:none}
.composer .composer-send.is-counting .icon{display:none}
.tabbar{flex:0 0 auto;display:flex;align-items:stretch;min-height:var(--tabbar-h);border-top:1px solid var(--u-border);background:var(--u-bg)}
.tab{flex:1 1 0;min-width:0;min-height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:var(--s1);font-size:var(--t-cap);font-weight:500;line-height:var(--lh-tight);color:var(--u-muted);text-align:center;overflow-wrap:anywhere}
.tab.is-active,.tab[aria-current="page"]{color:var(--u-primary-ink)}
body[data-view]:not([data-view="chat"]) .stream,
body[data-view]:not([data-view="chat"]) .status,
body[data-view]:not([data-view="chat"]) .composer{display:none}

.fault,.ticket-view,.me-view{display:none}
body[data-view="fault"] .fault,
body[data-view="ticket"] .ticket-view,
body[data-view="me"] .me-view{display:flex!important}
body[data-view]:not([data-view="chat"]) .toast{bottom:calc(var(--tabbar-h) + var(--s3))}

.fault-recent{display:flex;flex-wrap:wrap;gap:var(--s2)}
.fault-code{font-family:var(--font-mono);font-size:var(--t-h2);font-weight:700;overflow-wrap:anywhere}
.fault-h,.fault-source,.me-about{font-size:var(--t-cap);color:var(--u-muted)}
.fault-h{margin-top:var(--s3);font-weight:600}
.fault-actions{display:flex;flex-direction:column;gap:var(--s1);margin:0;padding-left:var(--s4)}
.fault-actions li{overflow-wrap:anywhere}
.fault-source{margin-top:var(--s3);padding-top:var(--s2);border-top:1px solid var(--u-border)}
.badge[data-tone="info"]{color:var(--u-muted)}
.badge[data-tone="accent"]{border-color:var(--u-primary-ink);color:var(--u-primary-ink)}
.badge[data-tone="warn"]{background:var(--u-warn);border-color:var(--u-warn);color:var(--u-on-primary)}
.badge[data-tone="fatal"]{background:var(--u-danger);border-color:var(--u-danger);color:var(--u-on-primary)}
.ticket-form{display:flex;flex-direction:column;gap:var(--s3)}
.field{display:flex;flex-direction:column;gap:var(--s1);font-size:var(--t-sm);font-weight:600}
textarea.input{min-height:96px;resize:vertical}
.ticket-actions{display:flex;flex-wrap:wrap;gap:var(--s2)}
#ticket-error{padding-left:var(--s3);border-left:3px solid var(--u-danger);font-size:var(--t-sm);overflow-wrap:anywhere}
.me-group{margin:0 0 var(--s4);padding:0;border:0}
.me-group legend{margin-bottom:var(--s2);padding:0;font-size:var(--t-sm);font-weight:600;color:var(--u-muted)}
.radio-row{display:flex;align-items:center;gap:var(--s3);min-height:44px;border-bottom:1px solid var(--u-border);cursor:pointer}
.radio-row input{flex:0 0 auto;width:20px;height:20px;margin:0;accent-color:var(--u-primary-ink)}
.radio-row:focus-within{outline:2px solid var(--u-focus);outline-offset:-2px}
.toast{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--tabbar-h) + var(--composer-h) + var(--s3));max-width:calc(100% - var(--s8));z-index:var(--z-toast);padding:var(--s2) var(--s4);border-radius:var(--r-full);background:var(--u-text);color:var(--u-bg);font-size:var(--t-sm);line-height:var(--lh-tight);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cite{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 4px;margin:0 2px;border:1px solid var(--u-primary-ink);border-radius:4px;background:transparent;color:var(--u-primary-ink);font-size:11px;line-height:1;font-variant-numeric:tabular-nums;position:relative;cursor:pointer}
.cite::before{content:"";position:absolute;inset:-13px}
.cite::after{content:"";position:absolute;inset:0;border-radius:3px;background:var(--u-primary-ink);opacity:0;transition:opacity var(--dur-fast) linear;   /* 按压反馈 ≤100ms（09 §3.1） */}
.cite:active::after{opacity:.2}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);min-height:44px;min-width:44px;padding:0 var(--s4);border:1px solid transparent;border-radius:var(--r-md);font-size:var(--t-sm);font-weight:600;line-height:var(--lh-tight);overflow-wrap:anywhere; transition:transform var(--dur-fast) var(--ease-out)}
.btn-primary{background:var(--u-primary);color:var(--u-on-primary);border-color:var(--u-primary)}
.btn-ghost{background:transparent;color:var(--u-text);border-color:var(--u-border)}
.btn-danger{background:var(--u-danger);color:var(--u-on-primary);border-color:var(--u-danger)}

.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.input{display:block;width:100%;min-height:44px;padding:var(--s3);border:1px solid var(--u-border);border-radius:var(--r-md);background:var(--u-bg);color:var(--u-text);font:inherit}
.input::placeholder{color:var(--u-muted)}
.input-lg{min-height:48px;font-size:var(--t-title)}
/* 12 §8：德语长词按 <html lang> 断词（applyLang 写），.badge 在 flex 行里允许收缩 */
.btn,.tab,.badge,.radio-row span,legend{hyphens:auto;-webkit-hyphens:auto}
.badge{max-width:100%}
/* 徽章 22 高、不做 44 宽 */
.badge{display:inline-flex;align-items:center;justify-content:center;min-height:22px;padding:0 var(--s2);border-radius:var(--r-full);background:var(--u-surface);border:1px solid var(--u-border);font-size:var(--t-cap);line-height:1;overflow-wrap:anywhere}
.card,.fault-card{background:var(--u-surface);border:1px solid var(--u-border);border-radius:var(--r-lg);padding:var(--s4)}
.divider{height:1px;margin:var(--s3) 0;border:0;background:var(--u-border)}

.overlay{position:fixed;inset:0;z-index:var(--z-sheet);background:var(--u-scrim);opacity:0;transition:opacity 160ms linear}

.overlay.is-open .sheet{transform:translateY(var(--sheet-dy,0px));transition-duration:220ms}
.sheet-handle{width:36px;height:4px;margin:var(--s2) auto;border-radius:var(--r-full);background:var(--u-border)}
.sheet-head{display:flex;align-items:center;gap:var(--s2);padding:0 var(--s4) var(--s2)}
.sheet-title{flex:1 1 auto;min-width:0;font-size:var(--t-title);font-weight:700}
.sheet-close{flex:0 0 auto;padding:0 var(--s2)}
.sheet-body{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:0 var(--s4) var(--s3)}
.sheet-foot{display:flex;gap:var(--s2);border-top:1px solid var(--u-border);padding:var(--s3) var(--s4) calc(var(--s3) + env(safe-area-inset-bottom))}
.sheet-foot .btn{flex:1 1 auto;min-width:0}

.sheet :focus-visible{outline-offset:-2px}

.cite-card,.cite-item{padding:var(--s3);border:1px solid var(--u-border);border-radius:var(--r-md);background:var(--u-surface)}
.cite-card+.cite-card{margin-top:var(--s3)}
.cite-doc{font-weight:600;overflow-wrap:anywhere}
.cite-meta{margin-top:var(--s1);font-size:var(--t-sm);color:var(--u-muted)}
.cite-text{margin-top:var(--s2);overflow-wrap:anywhere}
mark{background:var(--u-mark);color:inherit;border-radius:3px}
body[data-app="console"]{font-size:var(--t-sm);background:var(--c-bg);color:var(--c-text)}
body[data-app="console"] .card{background:var(--c-surface);border-color:var(--c-border)}

  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}

  .overlay,.sheet{transition:opacity 120ms linear!important}
}
</style>
</head>

  <symbol id="i-message-circle" viewBox="0 0 24 24"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></symbol>
  <symbol id="i-alert-triangle" viewBox="0 0 24 24"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></symbol>
  <symbol id="i-ticket" viewBox="0 0 24 24"><path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/><path d="M13 5v2"/><path d="M13 17v2"/><path d="M13 11v2"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></symbol>
  <!-- AI 客服头像：机器人头（对话流里每条 AI 气泡左侧那一个）。与 #i-user 成对，
       两个都画在 sprite 里，页面不需要任何外部图片资源（ADR-0005 无构建、无外链）。 -->
  <symbol id="i-bot" viewBox="0 0 24 24"><rect x="4" y="8" width="16" height="12" rx="4"/><path d="M12 8V4"/><circle cx="12" cy="3" r="1"/><path d="M9 14h.01"/><path d="M15 14h.01"/><path d="M9.5 17.5h5"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></symbol>
  <symbol id="i-chevron-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
</svg>

<div class="phone" id="app">

  <header class="hdr">
    <!-- 详情页返回，默认隐藏（10 §1 原样保留）；.hdr-back 的 44×44 由 CSS 保证 -->
    <button class="hdr-back" type="button" aria-label="Back" data-i18n-aria="a11y.back" hidden>
      <svg class="icon" aria-hidden="true"><use href="#i-chevron-left"></use></svg>
    </button>
    <h1 class="hdr-title" data-i18n="chat.title">WOTAI Support</h1>
    <!-- 语言按钮：图标 + 语言代码。"EN" 是语言代码不是文案，由 user.js 按 state.lang 写进
         .lang-code（不要用 textContent 整个按钮，否则图标会被抹掉）。
         点它打开下面的五语菜单（D7）：常驻、不弹层、不打断输入。 -->
    <button class="hdr-lang" id="btn-lang" type="button" aria-label="Change language" data-i18n-aria="a11y.lang"
      aria-haspopup="menu" aria-expanded="false" aria-controls="lang-menu">
      <svg class="icon" aria-hidden="true"><use href="#i-globe"></use></svg>
      <span class="lang-code">EN</span>
    </button>
    <!-- 五语菜单：每一项都用**母语**写（Deutsch / English / 中文 / Nederlands / Español），
         所以切到任何界面语言后，用户仍认得出自己那一行（`lib/lang.js:LANG_NAMES` 是同一份表）。
         静态写在 HTML 里是为了"JS 还没跑"时也点得动；顺序与 SUPPORTED_LANGS 一致，由
         `tests/assets.test.ts` 断言两者不漂。 -->
    <div class="lang-menu" id="lang-menu" role="menu" hidden>
      <button class="lang-item" type="button" role="menuitem" data-lang="zh"><span class="lang-code">ZH</span><span>中文</span></button>
      <button class="lang-item" type="button" role="menuitem" data-lang="en"><span class="lang-code">EN</span><span>English</span></button>
      <button class="lang-item" type="button" role="menuitem" data-lang="de"><span class="lang-code">DE</span><span>Deutsch</span></button>
      <button class="lang-item" type="button" role="menuitem" data-lang="nl"><span class="lang-code">NL</span><span>Nederlands</span></button>
      <button class="lang-item" type="button" role="menuitem" data-lang="es"><span class="lang-code">ES</span><span>Español</span></button>
    </div>
  </header>

  <!-- 离线黄条：默认 hidden，由 user.js 按 online/offline 事件切换（issue 01 "断网时顶部黄条"）。
       role=status 让读屏播报一次，不必再抢 #stream 的 live region。 -->
  <div class="offline" id="offline" role="status" hidden data-i18n="chat.err.offline">Network disconnected, retrying automatically</div>

  <!-- 消息流：唯一的新增内容 live region（10 §9）。本卡不预置任何假消息，空态就是空白 -->
  <main class="stream" id="stream" aria-live="polite">
  </main>

  <!-- 06#03 三视图：与 .stream/.composer 同级，显隐只认 body[data-view]（JS 改这一个属性，
       hidden 只是首屏兜底）。可见文案全部挂 data-i18n*，德语兜底只为 JS 未跑时可读。
       故障码结果卡由 JS 建（.card.fault-card），本文件只留空容器。 -->
  <section class="fault" data-view="fault" hidden>
    <input id="fault-input" class="input input-lg" type="text" maxlength="8"
      placeholder="Fehlercode eingeben, z. B. E03" data-i18n-ph="fault.placeholder"
      aria-label="Fehlercode eingeben" data-i18n-aria="fault.placeholder"
      autocapitalize="characters" autocomplete="off" spellcheck="false" inputmode="text">
    <div class="fault-recent" id="fault-recent"></div>
    <div class="fault-result" id="fault-result" aria-live="polite"></div>
  </section>

  <!-- 工单页（10 §6）：只做转人工入口与单号展示；提交后 #ticket-done 顶掉表单 -->
  <section class="ticket-view" data-view="ticket" hidden>
    <form class="ticket-form" id="ticket-form" novalidate>
      <label class="field" for="ticket-email">
        <span data-i18n="ticket.email.label">Kontakt-E-Mail</span>
        <input class="input" id="ticket-email" type="email" name="email" maxlength="160"
          placeholder="you@example.com" data-i18n-ph="ticket.email.ph"
          aria-label="Kontakt-E-Mail" data-i18n-aria="ticket.email.label"
          autocomplete="email" inputmode="email">
      </label>
      <label class="field" for="ticket-question">
        <span data-i18n="ticket.question.label">Problem</span>
        <textarea class="input" id="ticket-question" name="question" rows="3" maxlength="2000"
          placeholder="Problem kurz beschreiben" data-i18n-ph="ticket.question.ph"
          aria-label="Problem" data-i18n-aria="ticket.question.label"></textarea>
      </label>
      <button class="btn btn-primary" id="ticket-submit" type="submit" data-i18n="ticket.submit">Absenden</button>
      <p id="ticket-error" role="alert" hidden></p>
    </form>
    <div class="card" id="ticket-done" hidden>
      <div class="fault-h" data-i18n="ticket.created.no">Ticketnummer</div>
      <span class="ticket-no" id="ticket-no"></span>
      <div class="ticket-actions">
        <button class="btn btn-ghost" id="ticket-copy" type="button" data-i18n="common.copy">Kopieren</button>
        <button class="btn btn-ghost" id="ticket-status" type="button" data-i18n="ticket.viewStatus">Status prüfen</button>
      </div>
      <div id="ticket-state"></div>
      <p class="fault-source" data-i18n="ticket.created.hint">Wir melden uns innerhalb von 4 Stunden</p>
    </div>
  </section>

  <!-- 我的页（10 §7）：语言 / 外观 / 数据 / 关于；单选行的选中态由 JS 写 checked -->
  <section class="me-view" data-view="me" hidden>
    <fieldset class="me-group">
      <legend data-i18n="me.lang">Sprache</legend>
      <label class="radio-row" for="lang-zh"><input type="radio" id="lang-zh" name="lang" value="zh"><span>ZH</span><span data-i18n="lang.zh">中文</span></label>
      <label class="radio-row" for="lang-en"><input type="radio" id="lang-en" name="lang" value="en"><span>EN</span><span data-i18n="lang.en">English</span></label>
      <label class="radio-row" for="lang-de"><input type="radio" id="lang-de" name="lang" value="de"><span>DE</span><span data-i18n="lang.de">Deutsch</span></label>
      <label class="radio-row" for="lang-nl"><input type="radio" id="lang-nl" name="lang" value="nl"><span>NL</span><span data-i18n="lang.nl">Nederlands</span></label>
      <label class="radio-row" for="lang-es"><input type="radio" id="lang-es" name="lang" value="es"><span>ES</span><span data-i18n="lang.es">Español</span></label>
    </fieldset>
    <fieldset class="me-group">
      <legend data-i18n="me.theme">Darstellung</legend>
      <label class="radio-row" for="theme-system"><input type="radio" id="theme-system" name="theme" value="system"><span data-i18n="me.theme.system">Systemeinstellung</span></label>
      <label class="radio-row" for="theme-light"><input type="radio" id="theme-light" name="theme" value="light"><span data-i18n="me.theme.light">Hell</span></label>
      <label class="radio-row" for="theme-dark"><input type="radio" id="theme-dark" name="theme" value="dark"><span data-i18n="me.theme.dark">Dunkel</span></label>
    </fieldset>
    <fieldset class="me-group">
      <legend data-i18n="me.data">Daten</legend>
      <button class="btn btn-ghost" id="clear-data" type="button" data-i18n="me.data.clear">Lokale Sitzung löschen</button>
    </fieldset>
    <fieldset class="me-group">
      <legend data-i18n="me.about">Info</legend>
      <p class="me-about"><span id="app-version"></span> <span id="privacy" data-i18n="me.privacy">Datenschutz</span></p>
    </fieldset>
  </section>

  <!-- 状态条：默认 hidden，setStatus() 控制显隐；文案随 chat.status.* 切换 -->
  <div class="status" id="status" role="status" hidden data-i18n="chat.status.searching">Unterlagen werden durchsucht…</div>

  <!-- 输入区：<form> 只为语义与"单行输入 + 回车"的移动端键盘行为；#btn-send 显式
       type=button，提交与回车发送都归 user.js（10 §3.5），避免无脚本时点一下就把页面刷掉。
       textarea 的自动增高由 user.js 写 height、上限由 CSS 的 max-height:120px 兜住。 -->
  <form class="composer" id="composer" novalidate>
    <textarea id="input" class="composer-input" rows="1" maxlength="2000"
      placeholder="Type your question…" data-i18n-ph="chat.placeholder"
      aria-label="Type your question" data-i18n-aria="chat.placeholder"
      autocomplete="off" autocapitalize="sentences" enterkeyhint="send"></textarea>
    <button class="btn btn-primary composer-send" id="btn-send" type="button"
      aria-label="Send message" data-i18n-aria="a11y.send">
      <svg class="icon" aria-hidden="true"><use href="#i-send"></use></svg>
      <span class="send-label" hidden></span>
    </button>
  </form>

  <!-- 底部 tab：44 高触摸目标在 CSS。切页只写 body.dataset.view（10 §1 不做路由）；
       data-nav 是切页键，aria-current="page" 由 JS 挪到当前项，选中样式认它（.tab.is-active 保留相容）。 -->
  <nav class="tabbar" aria-label="Main navigation" data-i18n-aria="a11y.tab">
    <a class="tab is-active" href="#" data-tab="chat" data-nav="chat" aria-current="page">
      <svg class="icon" aria-hidden="true"><use href="#i-message-circle"></use></svg>
      <span data-i18n="nav.chat">Chat</span>
    </a>
    <a class="tab" href="#" data-tab="fault" data-nav="fault">
      <svg class="icon" aria-hidden="true"><use href="#i-alert-triangle"></use></svg>
      <span data-i18n="nav.fault">Fault code</span>
    </a>
    <a class="tab" href="#" data-tab="ticket" data-nav="ticket">
      <svg class="icon" aria-hidden="true"><use href="#i-ticket"></use></svg>
      <span data-i18n="nav.ticket">Ticket</span>
    </a>
    <a class="tab" href="#" data-tab="me" data-nav="me">
      <svg class="icon" aria-hidden="true"><use href="#i-user"></use></svg>
      <span data-i18n="nav.me">Profile</span>
    </a>
  </nav>

  <!-- Toast：空 div + role=status，文案由 user.js 的 t('toast.*') 注入。
       10 §1 把它画在 .phone 之外，这里挪进手机框内（absolute 定位）——桌面下手机框只有 693 高，
       放外面会飘在框下的深色背景上。 -->
  <div class="toast" id="toast" role="status" hidden></div>

</div>

<!-- 引用抽屉（06#02）：放在 .phone 之外、Toast 之后，覆盖整个视口。
     打开/关闭、焦点陷阱、Esc/下滑/点蒙层关闭都在 lib/cite-sheet.js；这里只给结构与 aria。 -->
<div class="overlay" id="cite-overlay" hidden>
  <div class="sheet" id="cite-sheet" role="dialog" aria-modal="true" aria-labelledby="cite-title">
    <div class="sheet-handle" aria-hidden="true"></div>
    <div class="sheet-head">
      <h2 class="sheet-title" id="cite-title" data-i18n="cite.title">Quelle 1 / 1</h2>
      <button class="btn btn-ghost sheet-close" id="cite-close" type="button"
        aria-label="Schließen" data-i18n-aria="common.close">
        <svg class="icon" aria-hidden="true"><use href="#i-x"></use></svg>
      </button>
    </div>
    <div class="sheet-body" id="cite-body"></div>
    <div class="sheet-foot">
      <button class="btn btn-ghost" id="cite-prev" type="button" data-i18n="cite.prev">Back</button>
      <button class="btn btn-ghost" id="cite-next" type="button" data-i18n="cite.next">Next</button>
    </div>
  </div>
</div>


<script type="module" src="/assets/user.js"></script>
</body>
</html>
